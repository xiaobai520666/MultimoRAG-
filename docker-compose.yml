version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-multimorag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-multimorag}
      POSTGRES_DB: ${POSTGRES_DB:-multimorag}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-multimorag}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./backend:/app
    environment:
      QWEN_API_KEY: ${QWEN_API_KEY}
      QWEN_API_BASE: ${QWEN_API_BASE:-https://dashscope.aliyuncs.com/api/v1}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-multimorag}:${POSTGRES_PASSWORD:-multimorag}@postgres:5432/${POSTGRES_DB:-multimorag}
      UPLOAD_DIR: /app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}/api/v1
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data: